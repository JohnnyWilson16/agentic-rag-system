# ==============================================================================
# Render Blueprint Specification for Agentic RAG System
# Deploys the unified FastAPI backend & Radiant Light Theme Enterprise Console
# ==============================================================================

services:
  - type: web
    name: agentic-rag-enterprise
    runtime: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: groq/llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: CREWAI_STORAGE_DIR
        value: /tmp/.crewai
      - key: CREWAI_CREDENTIALS_DIR
        value: /tmp/.crewai
